name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff mypy types-PyYAML
      - run: ruff check .
      - run: ruff format --check .
      - run: pip install -e ".[optimise,printing]"
      - run: mypy src
        continue-on-error: true

  unit:
    name: Unit tests (no CAE tools)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa
          pip install -e ".[dev,optimise,printing]"
      - name: Unit tests
        run: pytest tests/unit -v

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev,optimise,printing]"
      - name: Unit tests
        run: pytest tests/unit -v
      - name: Geometry and meshing work on Windows
        run: pytest tests/integration -v -m gmsh --timeout 1800
      - name: CLI runs
        run: |
          openoptima templates
          openoptima doctor examples/l_bracket/project.yaml
        continue-on-error: true   # doctor needs a solver; see the note below
      # CalculiX has no standard Windows package, so a full solve is not run
      # here. tests/unit/test_platform.py covers the platform-specific process
      # control and solver discovery paths on every platform.

  integration:
    name: Integration and verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CAE tools
        run: |
          sudo apt-get update
          sudo apt-get install -y calculix-ccx libglu1-mesa
          ccx -v || true
      - name: Install
        run: pip install -e ".[dev,optimise,printing]"
      - name: Check the example project
        run: openoptima doctor examples/l_bracket/project.yaml
      - name: Integration tests
        run: pytest tests/integration -v --timeout 1800
      - name: Verification benchmarks
        run: pytest tests/verification -v --timeout 1800
      - name: Short optimisation smoke test
        run: |
          openoptima optimise examples/l_bracket/project.yaml \
            --budget 16 --population 8 --discard-artifacts --quiet
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: study-output
          path: examples/l_bracket/openoptima_work/reports/
          if-no-files-found: ignore

  windows-app:
    name: Build the Windows application
    runs-on: windows-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -e ".[optimise,printing]"
          pip install pyinstaller
      - name: Freeze
        run: pyinstaller packaging\openoptima.spec --noconfirm --clean
      # A frozen build that compiles and then dies on first use is the normal
      # failure mode here, so start it and call its API before publishing.
      - name: Smoke-test the built application
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\OpenOptima\OpenOptima.exe" `
            -ArgumentList "--no-browser","--port","8791" -PassThru
          Start-Sleep -Seconds 20
          try {
            $status = Invoke-RestMethod -Uri "http://127.0.0.1:8791/api/status" -TimeoutSec 60
            Write-Host "gmsh in the frozen build: $($status.versions.gmsh)"
            if (-not $status.versions.gmsh -or $status.versions.gmsh -eq "not installed") {
              throw "the frozen build cannot load gmsh"
            }
            if ($status.templates.Count -lt 3) { throw "geometry templates missing from the bundle" }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: OpenOptima-windows
          path: dist/OpenOptima/
          retention-days: 14
