# OpenOptima example: a 3D-printed drone arm
#
# This is the example for a part that is *printed*, and printing changes the
# engineering in a way no other example here shows.
#
# A printed part is built from stacked layers that are fused together rather
# than continuous. It is markedly weaker between those layers than along them.
# So it has no single strength, and the usual measure of "how hard is this
# part working" -- von Mises stress -- cannot describe it at all, because that
# measure assumes the material is equally strong in every direction. Using it
# here would report a part as safe that is about to peel apart along its
# layers.
#
# Everything below follows from that. The material is described under
# `printed:` with a strength along the layers and a weaker one through them,
# and the factor of safety comes from a criterion that can express the
# difference.
#
# THE PART: one arm of a 7-inch class quadcopter, 1.2 kg all-up. A hollow box
# beam bolted to the centre plate at one end, carrying a motor on a pad at the
# other. The optimiser may change the section and the wall thickness.
#
# Run it:
#   openoptima doctor   examples/drone_arm/project.yaml
#   openoptima evaluate examples/drone_arm/project.yaml
#   openoptima optimise examples/drone_arm/project.yaml
#   openoptima report   examples/drone_arm/project.yaml
#
# WHAT IT FINDS. 106 designs, 45 of them usable, no errors, about seven
# minutes. The answer is a 25 x 24 mm box with a 2.5 mm wall, printed on
# edge: 70.5 g, a factor of safety of 8.1, and vibrating at 171 Hz.
#
# Sized on strength alone the same arm comes out at 40.7 g. Staying clear of
# the propeller costs 30 g, nearly doubling it -- and a stress check would
# never have asked. That is the point of the example.
#
# Note the shape of the answer: a big section with a thin wall. Stiffness is
# what matters here, and stiffness comes from how far the material sits from
# the centre, not from how much of it there is.
#
# WHICH WAY UP YOU PRINT IT IS A STRUCTURAL DECISION, NOT A WORKSHOP ONE, AND
# HERE THE OPTIMISER MAKES IT. `print_direction` is a design variable, so the
# search tries all three ways of laying the arm on the bed. Measured on the
# starting section -- identical shape, identical loads, identical mesh:
#
#     printed along z (flat)      stress 7.53 MPa   factor of safety 3.07
#     printed along y (on edge)   stress 7.56 MPa   factor of safety 3.05
#     printed along x (upright)   stress 7.54 MPa   factor of safety 1.55
#
# The stress does not move. The strength halves. Bending an arm stretches it
# along its length: printed flat or on edge that runs along the layers, which
# is strong, and printed upright it pulls the layers apart, which is weak.
#
# WHAT THE SEARCH CAN AND CANNOT TELL YOU HERE. It rules out `x` firmly: the
# lightest arm it can find printed upright is 106 g, against about 71 to 79 g
# the other two ways. Between `y` and `z` it cannot really choose -- fix each
# one and run the same search and both settle on the same section at 78.8 g,
# differing only in a factor of safety that never decides anything, because
# stiffness and vibration set this design rather than strength. So read the
# orientation it reports as "not upright" rather than as a recommendation
# between the other two.
#
# WHAT OPENOPTIMA DOES NOT KNOW ABOUT THIS CHOICE. It picks the strongest
# orientation and nothing else. It has no idea how much support material an
# orientation needs, how long it takes to print, what the surface finish comes
# out like, or whether the part even fits your bed that way up. If the answer
# below tells you to print it in a way that needs a raft of supports, that is
# a real cost the analysis never saw.

schema_version: 1
name: 3D-printed drone arm
description: >
  One arm of a 1.2 kg quadcopter, printed in PLA, sized for motor thrust and
  a hard landing. Shows how OpenOptima handles a material that is stronger
  along its print layers than through them, where a single allowable stress
  and von Mises stress cannot describe the part at all.

unit_system: mm_N_MPa_t

geometry:
  provider: occ
  template: drone_arm
  parameters:
    # Fixed by the aircraft and by the motor you have already bought.
    length: 150.0          # centre plate to motor axis
    root_length: 18.0      # kept solid: this is where the bolts go
    pad_length: 32.0       # motor mount pad
    pad_width: 32.0
    pad_thickness: 4.0
  variables:
    - id: width
      label: Arm width
      type: continuous
      minimum: 12.0
      maximum: 30.0
      default: 20.0
      unit: mm
      description: >
        Side to side. Resists the sideways part of a landing, and resists the
        arm twisting under motor torque.

    - id: height
      label: Arm depth
      type: continuous
      minimum: 12.0
      maximum: 30.0
      default: 18.0
      unit: mm
      description: >
        Top to bottom. This is the direction the thrust and the landing bend
        it in, so it is the most powerful variable here -- bending stiffness
        grows with the cube of this number.

    - id: print_direction
      label: Which way it is printed
      type: categorical
      # The axis the layers stack along. `z` is the part lying flat on the
      # bed, which is how you would normally print this. The optimiser is
      # allowed to try the other two, and it should reject `x` -- see the
      # note at the top of this file.
      choices: [x, y, z]
      default: z
      description: >
        Which way up the arm is printed. This is a structural decision, not a
        workshop one: it changes the factor of safety by a factor of two while
        the stress does not move.

    - id: wall
      label: Wall thickness
      type: continuous
      minimum: 2.0
      maximum: 6.0
      default: 3.0
      unit: mm
      description: >
        The arm is hollow between the root and the motor pad. Thinner saves
        mass; too thin and there are not enough elements across the wall for
        the stress to be trustworthy. See the note on the mesh below.

regions:
  - name: root_face
    description: Flat end bolted to the centre plate
    # Three faces on this part point back along -x: this one, the back of the
    # motor pad, and the end wall of the cavity. The box picks out the one at
    # x = 0. It is deliberately generous in y and z, because the arm section
    # is a design variable and this face grows and shrinks with it.
    selector:
      surface_type: plane
      normal: [-1.0, 0.0, 0.0]
      normal_tolerance_deg: 2.0
      within_box: { xmin: -1.0, ymin: -20.0, zmin: -35.0, xmax: 1.0, ymax: 20.0, zmax: 1.0 }

  - name: motor_pad
    description: Top face of the motor mount pad, where the thrust is applied
    # The motor mount plane is the datum this part is built from, so this face
    # sits at z = 4 and measures 32 x 32 mm at every design point, whatever the
    # section does. That is why one selector works across the whole range.
    # `openoptima doctor` reports the area at both ends of the range: it should
    # read 1024 mm2 at both.
    min_area_mm2: 1000.0
    selector:
      surface_type: plane
      normal: [0.0, 0.0, 1.0]
      normal_tolerance_deg: 2.0
      within_box: { xmin: 115.0, ymin: -20.0, zmin: 3.0, xmax: 155.0, ymax: 20.0, zmax: 5.0 }

material:
  name: PLA, printed solid
  density_kg_m3: 1240.0

  # Which failure criterion measures this material against the strengths
  # below. `hoffman` accounts for stresses acting together and for the
  # material being stronger in compression than in tension, which a print
  # very much is. It has a hard limit -- it cannot describe a material whose
  # weakest direction is too far below its strongest -- and OpenOptima
  # refuses the material and says so rather than reporting a margin it cannot
  # justify. The strengths below sit inside that limit.
  failure_criterion: hoffman

  printed:
    # Which way the layers stack. See the note at the top of this file: this
    # is a structural decision.
    # Names the design variable above, so the optimiser decides. Write a fixed
    # vector such as [0.0, 0.0, 1.0] instead to make the decision yourself.
    build_direction: print_direction

    # Stiffness. Typical of PLA printed near solid; measure your own prints if
    # the answer matters, because print settings move these a long way.
    along_layers_modulus_mpa: 3500.0
    through_layers_modulus_mpa: 2600.0
    in_plane_poisson: 0.36
    through_layers_poisson: 0.33
    through_layers_shear_modulus_mpa: 1100.0

    # STRENGTH IS A DESIGN DECISION, NOT A MATERIAL PROPERTY. Every number
    # here is a measured strength with a design factor already taken off it.
    # They are this example's choices and a different engineer would
    # reasonably choose differently. OpenOptima will not infer any of them.
    #
    # Note how much lower the through-layer TENSION is than the in-plane one:
    # that single number is what makes print direction matter. Compression
    # through the layers is barely reduced, because layers press together
    # perfectly well -- it is pulling them apart that they are bad at.
    strength:
      along_layers_tension_mpa: 22.0
      through_layers_tension_mpa: 11.0
      along_layers_compression_mpa: 30.0
      through_layers_compression_mpa: 28.0
      in_plane_shear_mpa: 16.0
      through_layers_shear_mpa: 9.0
      basis: >
        Measured strengths for near-solid PLA divided by a design factor of
        2.5, at room temperature. PLA softens badly in the sun or beside a
        warm motor: these numbers do not apply above about 50 C.

# The motor is carried by the arm, not part of it. It adds weight and inertia
# but no strength. This is what makes the vibration check below mean anything:
# on a 150 mm arm the motor is most of the moving mass, and leaving it out
# reports a rate far higher than the real one.
point_masses:
  - name: motor
    region: motor_pad
    mass_kg: 0.035
    description: >
      A 2207-size brushless motor with its propeller. Weigh yours: motors of
      the same nominal size vary by 10 g or more between makes, and this
      number moves the frequency more than any dimension of the arm does.

load_cases:
  # Both cases hold the arm the same way -- bolted flat to the centre plate,
  # which restrains it in all three directions. OpenOptima ENVELOPES load
  # cases: it reports the worst result across all of them and never the
  # average. Averaging a failing case against a passing one would hide the
  # failure.
  - id: max_thrust
    description: Full throttle, 8.8 N up at the motor
    boundary_conditions:
      - region: root_face
        kind: fixed
        dofs: [1, 2, 3]
    loads:
      - kind: force
        region: motor_pad
        # 1.2 kg all-up at 3:1 thrust to weight, divided by four motors.
        vector: [0.0, 0.0, 8.8]

  - id: hard_landing
    description: Hard landing on one arm, on a slope
    boundary_conditions:
      - region: root_face
        kind: fixed
        dofs: [1, 2, 3]
    loads:
      # THIS IS AN ASSUMPTION, NOT A MEASUREMENT. How hard a landing is
      # depends on the drop height and on how much the airframe and the
      # ground give, and no analysis here can tell you. 50 N is about four
      # times the whole aircraft's weight put through this one arm; the 20 N
      # sideways is landing on a slope or catching a skid. Change it to
      # something you can defend before sizing a real part.
      - kind: force
        region: motor_pad
        vector: [0.0, 20.0, 50.0]

mesh:
  # The wall can go as thin as 2 mm, and stress in a thin wall in bending
  # needs enough elements across it to be believed. At 2 mm and a 1.0 mm
  # minimum size that is about two second-order elements through the
  # thickness, which is the least worth trusting. Re-run the design you choose
  # at a finer mesh and confirm the numbers have stopped moving.
  global_size: 4.0
  minimum_size: 1.0
  element_order: 2
  algorithm: delaunay
  curvature_refinement: false
  min_scaled_jacobian: 0.05
  volume_tolerance: 0.02

stress_evaluation:
  # A fully fixed face is a singularity: the peak stress there grows without
  # bound as the mesh is refined, so optimising it would optimise the mesh
  # rather than the part. Use a high percentile with that region removed. The
  # raw peak is still reported on every result.
  measure: percentile
  percentile: 99.0
  excluded_regions: [root_face]

# Buckling is off, and OpenOptima would refuse to switch it on for this
# material anyway. The check that decides whether a buckling number can be
# trusted assumes one stiffness in every direction, and a printed part has
# two. A thin-walled arm in compression is a real concern; this analysis does
# not cover it.
buckling:
  enabled: false

# What rates the arm likes to vibrate at. A drone arm beside a spinning
# propeller is the textbook case: the propeller drives the arm at a known
# rate, and if that rate lands on one of the arm's own, small pushes build
# into large movements and the arm cracks -- under a load it would carry all
# day if it were steady.
#
# THIS NUMBER IS ONLY MEANINGFUL BECAUSE THE MOTOR IS IN THE MODEL. The motor
# is most of the moving mass on a 150 mm arm. Measured on this example, with
# the motor 121.5 Hz and without it 191.4 Hz -- 58% high, in the direction
# that looks safe. Delete the `point_masses` block above and the number stays
# plausible while being wrong.
modal:
  enabled: true
  modes: 6

# Whether a printer can make this shape, and what it would cost in support
# material. Both are reported as numbers you may constrain or trade against
# -- never as a gate. A design needing support is more work, not wrong.
#
# `support_area_mm2` is downward-facing surface too shallow to print on
# itself. The face resting on the bed is deliberately not counted: it points
# straight down and is perfectly flat, so it looks exactly like the worst
# overhang there is, and the bed is under it. On this part that exclusion
# reverses which orientation wins.
#
# THIS KNOWS NOTHING ABOUT THE PRINT ITSELF. It cannot tell that a short gap
# would be bridged rather than supported, it does not know whether you could
# reach a support to break it off -- support sealed inside this arm's hollow
# section is there for good -- and it says nothing about print time.
printing:
  enabled: true
  overhang_angle_deg: 45.0
  # A common desktop printer. Change it to yours.
  build_volume: { width_mm: 220.0, depth_mm: 220.0, height_mm: 250.0 }

solver:
  name: calculix
  timeout_seconds: 900
  threads: 1

objectives:
  - metric: mass_kg
    direction: minimise
    label: Mass

constraints:
  # 2.0 is this example's choice. The right number depends on how well the
  # loads above are known -- and the landing load is a guess -- on how
  # consistent your printer is, and on what happens if the arm breaks.
  - metric: factor_of_safety
    operator: greater_than_or_equal
    value: 2.0
    label: Factor of safety

  # Under the landing case. A springy arm moves the propeller around, which
  # the flight controller has to fight.
  - metric: displacement_max_mm
    operator: less_than_or_equal
    value: 3.0
    label: Tip movement

  # Keep the arm's own rate clear of the propeller's.
  #
  # The arithmetic, so you can redo it for your own aircraft. A 7-inch
  # propeller making the 900 gf each motor needs here turns at roughly 6500
  # rpm, and tops out near 8000 at full throttle. A propeller that is even
  # slightly out of balance shakes the arm once per turn, so 8000 rpm is
  # 8000/60 = 133 shakes a second, or 133 Hz. Asking for 170 Hz leaves about
  # 25% margin above that.
  #
  # BOTH NUMBERS ARE THIS EXAMPLE'S CHOICE, AND YOURS WILL DIFFER. The top
  # rate depends on your motor, propeller and battery -- measure it rather
  # than taking 8000 from here. How much margin is enough depends on how well
  # balanced your propellers are and on what happens if an arm fails.
  #
  # This constraint is what makes the example worth running. On stress alone
  # the starting design passes comfortably at a factor of safety of 3.07 --
  # and it vibrates at 121.5 Hz, inside the range the propeller turns at. A
  # stress check cannot see that at all, and the arm that avoids it is about
  # twice the mass of the one stress alone would have chosen.
  - metric: natural_frequency_hz
    operator: greater_than_or_equal
    value: 170.0
    label: First natural frequency

# A BIGGER SEARCH THAN THE OTHER EXAMPLES, AND THE REASON IS WORTH KNOWING.
# Letting the optimiser choose the print direction adds a fourth thing to
# decide, and a choice between three options is harder for a search than a
# dimension it can slide up and down. Measured here: on a budget of 64 the
# answer came back at 83.8 g, and on 120 at the figure quoted at the top of
# this file. Same problem, same code -- the smaller budget simply had not
# finished looking.
#
# The general lesson: giving the optimiser another decision to make is not
# free. If you add a variable, give it more evaluations, or you may get a
# worse answer and no hint that you did.
optimisation:
  initial_sampling:
    method: sobol
    evaluations: 24
    seed: 1
  algorithm:
    name: nsga2
    population_size: 20
    evaluation_budget: 120
    seed: 1
  parallel_jobs: 0
  max_retries: 1
