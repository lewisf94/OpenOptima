[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openoptima"
version = "0.1.0"
description = "Open-source parametric design optimisation for FEA and CFD, built on Gmsh, CalculiX and OpenFOAM"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "OpenOptima contributors" }]
keywords = [
    "optimisation",
    "fea",
    "cfd",
    "gmsh",
    "calculix",
    "openfoam",
    "design-of-experiments",
    "pareto",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "gmsh>=4.12",
]

[project.optional-dependencies]
optimise = ["pymoo>=0.6.1"]
cadquery = ["cadquery>=2.4"]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.2",
    "ruff>=0.5",
    "mypy>=1.15",
    "types-PyYAML",
]

[project.scripts]
openoptima = "openoptima.cli.main:main"
openoptima-app = "openoptima.app.launcher:main"

[project.urls]
Homepage = "https://github.com/lewisf94/OpenOptima"
Source = "https://github.com/lewisf94/OpenOptima"
Issues = "https://github.com/lewisf94/OpenOptima/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/openoptima"]

[tool.hatch.build.targets.wheel.force-include]
"src/openoptima/app/static" = "openoptima/app/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "gmsh: requires the gmsh Python module",
    "calculix: requires the CalculiX ccx executable",
    "slow: takes more than ~30 seconds",
    "verification: engineering verification benchmark with a documented tolerance",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S"]
ignore = [
    "S101",     # assert is fine in tests and for internal invariants
    "B008",
    "SIM108",
    # `str, Enum` is deliberate: every enum here is serialised to JSON and YAML
    # via an explicit `.value`, and the mixin keeps comparisons with plain
    # strings working for stored records. StrEnum would be equivalent but the
    # churn buys nothing.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501"]

[tool.mypy]
python_version = "3.11"
files = ["src/openoptima"]
ignore_missing_imports = true
# Deliberately off. This project has both Windows-only branches (ctypes.windll
# for the desktop app) and POSIX-only ones (os.killpg to stop a runaway
# solver). A suppression that is unused on one platform is required on the
# other, so with this on, `mypy src` reports a different set of problems on a
# developer's Windows machine than it does in Linux CI -- and the difference is
# always noise. Turning it off makes the check mean the same thing everywhere.
warn_unused_ignores = false
no_implicit_optional = true
warn_redundant_casts = true
